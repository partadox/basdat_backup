# =============================================================
# Docker Compose for Production/Coolify Deployment
# Uses External Database Server
# =============================================================

version: '3.8'

services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: postgres-recovery-simulator-prod
    ports:
      - "80:80"
    environment:
      - DB_HOST=145.79.10.205
      - DB_PORT=5432
      - DB_NAME=basdatbackup
      - DB_USER=dbPro
      - DB_PASSWORD=Ky7zboJPHIV7fcJIv71CKp7kkLgtDGJTH8chwAeWr6uJfuuv2efL2wIfwbl2twLg
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - simulator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/controller.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

networks:
  simulator-network:
    driver: bridge